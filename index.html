<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日星座運勢查詢</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* 右上角固定標籤 */
    .top-right-badge {
      position: fixed;
      top: 20px;
      right: 25px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #f8d210;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    /* 主卡片容器 */
    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 40px 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #f8d210;
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    /* 輸入區塊 */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.25);
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="date"]:focus {
      border-color: #f8d210;
    }

    /* 修正部分瀏覽器日期選擇器圖示顏色 */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #f8d210, #f59e0b);
      color: #1a1a2e;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(248, 210, 16, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    /* 結果顯示區 */
    .result-box {
      display: none;
      text-align: left;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 15px;
      padding: 25px;
      margin-top: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .zodiac-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .zodiac-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #f8d210;
    }

    .zodiac-date {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .fortune-item {
      margin-bottom: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .fortune-label {
      font-weight: bold;
      color: #38bdf8;
      margin-right: 6px;
    }

    .lucky-tags {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .tag {
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #e2e8f0;
    }
  </style>
</head>

      <div class="lucky-tags">

        <span id="luckyNumber" class="tag"></span>

    </div>

    function getZodiacIndex(month, day) {
      if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return 0; // 摩羯
      if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return 1;  // 水瓶
      if ((month == 2 && day >= 19) || (month == 3 && day <= 20)) return 2;  // 雙魚
      if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return 3;  // 牡羊
      if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return 4;  // 金牛
      if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return 5;  // 雙子
      if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return 6;  // 巨蟹
      if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return 7;  // 獅子
      if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return 8;  // 處女
      if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return 9; // 天秤
      if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return 10; // 天蠍
      return 11; // 射手 (11/22 - 12/21)
    }

    function calculateFortune() {
      const dateInput = document.getElementById("birthdate").value;
      if (!dateInput) {
        alert("請先選擇您的出生日期！");
        return;
      }

      const dateParts = dateInput.split("-");
      const month = parseInt(dateParts[1], 10);
      const day = parseInt(dateParts[2], 10);

      const index = getZodiacIndex(month, day);
      const data = zodiacData[index];

      document.getElementById("zodiacName").textContent = data
